<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<link rel="stylesheet" href="/css/site.{{v}}.css">
<!-- .js switches on the sticky phone and hides the inline step screenshots.
     Only set it where a module can run, and take it back if the load fails,
     so a blocked or missing script never leaves screenshots hidden. -->
<script>if('noModule' in HTMLScriptElement.prototype&&'IntersectionObserver' in window)document.documentElement.classList.add('js')</script>
<script type="module" src="/js/site.{{v}}.js" onerror="document.documentElement.classList.remove('js')"></script>
</head>
<body>
<header class="site-header">
  <div class="container">
    <a class="brand" href="/">
      <img class="brand-icon" src="/img/icon-64.png" alt="" width="30" height="30">
      <span class="brand-name">Sideline Hero</span>
    </a>
    <nav class="site-nav" aria-label="Site">
      <a class="nav-how" href="/#how-it-works">How it works</a>
      <a href="/faq">FAQ</a>
      <a href="/support">Support</a>
      <span class="tag tag-ink">Coming soon</span>
    </nav>
  </div>
</header>
<main id="main">{{body}}</main>
<footer class="site-footer">
  <div class="container">
    <p>Sideline Hero · made by tommamakesthings.</p>
    <nav aria-label="Footer">
      <a href="/privacy">Privacy</a>
      <a href="/terms">Terms</a>
      <a href="/faq">FAQ</a>
      <a href="/support">Support</a>
    </nav>
  </div>
</footer>
</body>
</html>
