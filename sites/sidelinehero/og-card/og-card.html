<!doctype html>
<!--
  Source of the 1200x630 share card (og:image) for sidelinehero.app.
  Not deployed: build.mjs only copies src/. Re-render after editing with
  sites/sidelinehero/og-card/render.sh, which writes src/img/og-card.<hash>.png.
  Fonts, colours and the screenshot are the site's own, from ../src.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Anton; src: url(../src/fonts/anton-400.woff2) format('woff2'); }
  @font-face { font-family: Saira; src: url(../src/fonts/saira-700.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: Hanken; src: url(../src/fonts/hanken-400.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: Hanken; src: url(../src/fonts/hanken-700.woff2) format('woff2'); font-weight: 700; }
  html, body { margin: 0; }
  .card {
    width: 1200px; height: 630px; box-sizing: border-box; overflow: hidden;
    position: relative; background: #14100B; color: #F3EADB;
    padding: 64px 0 0 72px; font-family: Hanken, sans-serif;
  }
  /* Chalk arcs, like the site's hero. */
  .arcs {
    position: absolute; right: -260px; top: -240px; width: 900px; height: 900px;
    border-radius: 50%; border: 2px solid #2E2619;
    box-shadow: 0 0 0 90px #14100B, 0 0 0 92px #2E2619;
  }
  .brand { display: flex; align-items: center; gap: 14px; position: relative; }
  .brand img { width: 52px; height: 52px; border-radius: 12px; }
  .brand span {
    font-family: Saira, sans-serif; font-weight: 700; font-size: 26px;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  h1 {
    position: relative; margin: 44px 0 0; width: 640px;
    font-family: Anton, sans-serif; font-weight: 400; font-size: 92px;
    line-height: 1.02; text-transform: uppercase; letter-spacing: 0.01em;
  }
  h1 em { font-style: normal; color: #E8671A; }
  p {
    position: relative; margin: 28px 0 0; width: 600px;
    font-size: 30px; line-height: 1.35; color: #CFC4B2;
  }
  .tag {
    position: absolute; left: 72px; bottom: 56px;
    font-family: Saira, sans-serif; font-weight: 700; font-size: 20px;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: #14100B; background: #F4B27A; padding: 8px 14px; border-radius: 4px;
  }
  .phone {
    position: absolute; right: 90px; top: 70px; width: 300px;
    border-radius: 34px; border: 8px solid #2E2619;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<div class="card">
  <div class="arcs"></div>
  <div class="brand"><img src="../src/img/icon-180.png" alt=""><span>Sideline Hero</span></div>
  <h1>Coach the game,<br><em>not the subs.</em></h1>
  <p>Fair rotations for youth basketball, planned before tip-off.</p>
  <div class="tag">iPhone · Android</div>
  <img class="phone" src="../src/img/shot-live.b0833605.png" alt="">
</div>
</body>
</html>
